name: Deploy chat-worker
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'wrangler.toml'
      - 'package.json'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check (contract + type check)
        run: npm run check

      - name: Test
        run: npm test

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pin wrangler version — same policy as the pages workflow.
          wranglerVersion: '3.114.17'
          command: deploy --var SENTRY_RELEASE:${{ github.sha }}

      - name: Smoke test
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          sleep 5
          curl -fsS https://b-social-chat.nicbj96.workers.dev/health | grep -q '"status":"ok"'
