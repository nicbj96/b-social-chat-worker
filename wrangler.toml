name = "b-social-chat"
main = "src/index.ts"
compatibility_date = "2024-09-23"
# nodejs_compat is required by @sentry/cloudflare (uses AsyncLocalStorage).
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[vars]
SUPABASE_URL = "https://rbengtfrthqdfbcdcugp.supabase.co"

# Secrets (set via `npx wrangler secret put <NAME>`):
#   SUPABASE_KEY      — Supabase anon or service_role key
#   VAPID_PUBLIC_KEY  — Web Push public key
#   VAPID_PRIVATE_KEY — Web Push private key (d parameter)
#   VAPID_SUBJECT     — mailto:... contact for push services
#   PUSH_ADMIN_KEY    — admin auth for /push/broadcast (optional)
#   SENTRY_DSN        — Sentry DSN for error tracking (optional)

# Scheduled jobs:
#   Fri 17:00 UTC → weekly push digest
#   Mon 06:00 UTC → ad-pack robot (drafts 3 ads from the week's best events → queue)
#   Wed 07:00 UTC → partner-finder robot (top venues → outreach target list → queue)
[triggers]
crons = ["0 17 * * 5", "0 6 * * 1", "0 7 * * 3"]
